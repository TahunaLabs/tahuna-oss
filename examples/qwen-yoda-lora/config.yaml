project: qwen-yoda-lora
entrypoint: train.py
command:
  - python
  - train.py
train:
  # Change to Qwen/Qwen3-0.6B for a cheaper smoke test.
  model_name: Qwen/Qwen3-4B
  data_dir: data/yoda
  output_dir: outputs
  epochs: 1
  batch_size: 16
  learning_rate: 0.0001
data:
  path: data
resources:
  gpu_type: NVIDIA GeForce RTX 4090
  gpu_count: 1
  volume_gb: 80

# Generated from local Tahuna project state.
[project]
data_dir = "data"
output_dir = "outputs"

[environment]
framework = "pt"
version = "2.10.0-cu128"
python_version = "3.11"
gpu_type = "NVIDIA GeForce RTX 3090"
gpu_count = 1
volume_gb = 10

[train]
command = ["uv", "run", "--active", "--no-sync", "python", "-u", "train.py"]
dependency_group = "train"
output_model_path = "outputs/model"

[serve]
command = ["uv", "run", "--active", "--no-sync", "python", "-u", "inference.py"]
dependency_group = "serve"
python_version = "3.11"
gpu_type = "NVIDIA L4"
gpu_count = 1
volume_gb = 10
port = 8000
health_path = "/health"
default_model_path = "outputs/model"
startup_timeout_seconds = 900
health_interval_seconds = 5
health_timeout_seconds = 2
health_failure_threshold = 3
graceful_shutdown_seconds = 30

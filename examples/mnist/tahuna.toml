# Runnable configuration for the checked-in MNIST example.
[project]
data_dir = "data"
output_dir = "outputs"

[environment]
framework = "pt"
version = "2.4.0-cu124"
python_version = "3.11"
gpu_type = "L4"
gpu_count = 1
volume_gb = 10

[train]
command = ["uv", "run", "--active", "--no-sync", "python", "-u", "train.py"]
dependency_group = ""
output_model_path = "outputs/model"

services:
  postgres:
    image: postgres:16
    container_name: tahuna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tahuna
    ports:
      - "5432:5432"
    volumes:
      - tahuna_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tahuna"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: tahuna-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tahuna_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  tahuna_postgres_data:
  tahuna_redis_data:

name: Cloudflare Bootstrap

on:
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  FRONTEND_PROJECT: tahuna
  DOCS_PROJECT: tahuna-docs
  ASSETS_BUCKET: ${{ vars.CLOUDFLARE_ASSETS_BUCKET_NAME }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4.92.0

      - name: Verify Cloudflare auth
        run: wrangler whoami

      - name: Ensure frontend Pages project exists
        run: |
          wrangler pages project create "$FRONTEND_PROJECT" --production-branch main --compatibility-date 2026-05-18 --compatibility-flag nodejs_compat || true

      - name: Ensure docs Pages project exists
        run: |
          wrangler pages project create "$DOCS_PROJECT" --production-branch main --compatibility-date 2026-05-18 --compatibility-flag nodejs_compat || true

      - name: Ensure assets bucket exists
        if: env.ASSETS_BUCKET != ''
        run: |
          wrangler r2 bucket create "$ASSETS_BUCKET" --location weur || true

      - name: Sync frontend Pages secrets
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TAHUNA_MANAGED_RUNPOD_API_KEY: ${{ secrets.TAHUNA_MANAGED_RUNPOD_API_KEY }}
        run: |
          secrets_file="$(mktemp)"
          jq -n \
            --arg stripe "$STRIPE_SECRET_KEY" \
            --arg webhook "$STRIPE_WEBHOOK_SECRET" \
            --arg runpod "$TAHUNA_MANAGED_RUNPOD_API_KEY" \
            '{
              STRIPE_SECRET_KEY: $stripe,
              STRIPE_WEBHOOK_SECRET: $webhook,
              TAHUNA_MANAGED_RUNPOD_API_KEY: $runpod
            } | with_entries(select(.value != ""))' > "$secrets_file"

          if [ "$(jq 'length' "$secrets_file")" -eq 0 ]; then
            echo "No frontend secrets provided. Skipping secret sync."
            exit 0
          fi

          wrangler pages secret bulk "$secrets_file" --project-name "$FRONTEND_PROJECT"

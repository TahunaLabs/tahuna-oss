name: Build Runtime Images

on:
  push:
    # MVP phase: trigger from develop.
    # TODO: switch this back to `main` once MVP is complete.
    branches:
      - develop
  workflow_dispatch:

jobs:
  # First job: read runtime image definitions and output matrix
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-matrix.outputs.images }}
    steps:
      - uses: actions/checkout@v5
      - id: set-matrix
        run: |
          # Convert images.json to matrix format: [{tag, base}, ...]
          MATRIX=$(jq -c '[to_entries[] | .key as $fw | .value | to_entries[] | {tag: "\($fw)-\(.key)", base: .value}]' web/convex/runtime-images.json)
          echo "images=$MATRIX" >> $GITHUB_OUTPUT

  # Second job: build each image
  build:
    needs: matrix
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.images) }}
        
    steps:
      - uses: actions/checkout@v5
      
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: runtime/images/Dockerfile
          pull: true
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tahuna:${{ matrix.tag }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            WANDB_BASE_URL=${{ secrets.TAHUNA_WANDB_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

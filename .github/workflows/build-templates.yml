name: Build Runtime Images

on:
  push:
    branches:
      - develop
      - main
    paths:
      - runtime/images/**
      - runtime/images/prebake/**
      - runtime/warden/**
      - web/convex/runtime-images.json
      - .github/workflows/build-templates.yml
  workflow_dispatch:

jobs:
  # First job: read runtime image definitions and output matrix
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-matrix.outputs.images }}
    steps:
      - uses: actions/checkout@v5
      - id: set-matrix
        run: |
          PREBAKED_PACKAGES=$(jq -r '.default | join(",")' runtime/images/prebake/protected-packages.json)
          # Cross-product framework × version × python_version into matrix entries
          MATRIX=$(jq -c --arg protected "$PREBAKED_PACKAGES" '
            [
              to_entries[] | .key as $fw |
              .value | to_entries[] |
              .key as $ver |
              .value.base as $base |
              .value.python[] as $py |
              {
                framework: $fw,
                version: $ver,
                python_version: $py,
                tag: "\($fw)-\($ver)-py\($py)",
                base: $base,
                protected_packages: $protected
              }
            ]
          ' web/convex/runtime-images.json)
          echo "images=$MATRIX" >> $GITHUB_OUTPUT

  # Second job: build each image
  build:
    needs: matrix
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'Production – tahuna' || 'Preview – tahuna' }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/tahunalabs
      IMAGE_REPO: ${{ github.ref_name == 'main' && 'tahuna' || 'tahuna-dev' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.images) }}

    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          sudo apt-get clean >/dev/null 2>&1 || true
          sudo docker system prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: runtime/images/Dockerfile
          pull: true
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            PREBAKE_FRAMEWORK=${{ matrix.framework }}
            PREBAKE_VERSION=${{ matrix.version }}
            PREBAKE_PYTHON_VERSION=${{ matrix.python_version }}
            PREBAKE_PROTECTED_PACKAGES=${{ matrix.protected_packages }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:cache-${{ matrix.tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:cache-${{ matrix.tag }},mode=max

name: Build Templates

on:
  push:
    paths:
      - 'templates/**'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tag: pt-2.8.0-cu128
            base: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
          - tag: pt-2.4.0-cu124
            base: runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04
          - tag: pt-2.2.0-cu121
            base: runpod/pytorch:2.2.0-py3.10-cuda12.1.1-devel-ubuntu22.04
          - tag: pt-2.1.0-cu118
            base: runpod/pytorch:2.1.0-py3.10-cuda11.8.0-devel-ubuntu22.04
            
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          
      - name: Check if image exists
        id: check
        run: |
          if docker manifest inspect ${{ secrets.DOCKER_USERNAME }}/tahuna:${{ matrix.tag }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ./templates
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tahuna:${{ matrix.tag }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

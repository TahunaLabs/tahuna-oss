name: Bootstrap

on:
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  FRONTEND_PROJECT: tahuna
  DOCS_PROJECT: tahuna-docs
  ASSETS_BUCKET: ${{ vars.CLOUDFLARE_ASSETS_BUCKET_NAME }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install Wrangler
        run: bunx wrangler@4.92.0 --version

      - name: Verify Cloudflare auth
        run: bunx wrangler@4.92.0 whoami

      - name: Ensure frontend Pages project exists
        run: |
          bunx wrangler@4.92.0 pages project create "$FRONTEND_PROJECT" --production-branch main --compatibility-date 2026-05-18 --compatibility-flag nodejs_compat || true

      - name: Ensure docs Pages project exists
        run: |
          bunx wrangler@4.92.0 pages project create "$DOCS_PROJECT" --production-branch main --compatibility-date 2026-05-18 --compatibility-flag nodejs_compat || true

      - name: Ensure assets bucket exists
        if: env.ASSETS_BUCKET != ''
        run: |
          bunx wrangler@4.92.0 r2 bucket create "$ASSETS_BUCKET" --location weur || true

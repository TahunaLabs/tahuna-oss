name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  javascript:
    name: Dependency audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - web
          - docs
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: bun install --frozen-lockfile
      - name: Audit production dependencies
        working-directory: ${{ matrix.directory }}
        run: bun audit --production

  go:
    name: Go vulnerability scan (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - cli
          - runtime/warden
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.directory }}/go.mod
          cache-dependency-path: ${{ matrix.directory }}/go.sum
      - name: Scan reachable dependencies
        working-directory: ${{ matrix.directory }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

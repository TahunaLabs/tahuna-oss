name: Deploy Site

on:
  push:
    branches:
      - main
      - develop
    paths:
      - web/**
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ vars.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_POSTHOG_UI_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_UI_HOST }}
        run: bun run pages:build

      - name: Resolve branch
        id: branch
        run: echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        working-directory: web/.open-next
        run: |
          set -e
          cp worker.js _worker.js
          cp -r assets/_next _next
          printf '/install.sh https://raw.githubusercontent.com/TahunaLabs/tahuna-cli/main/scripts/install-tahuna.sh 302\n' > _redirects
          cat > _routes.json << 'EOF'
          {
            "version": 1,
            "include": ["/*"],
            "exclude": ["/_next/static/*", "/favicon.ico", "/robots.txt", "/sitemap.xml", "/manifest.webmanifest", "/install.sh"]
          }
          EOF
          bunx wrangler@4.92.0 pages deploy . \
            --project-name tahuna \
            --branch "${{ steps.branch.outputs.name }}" \
            --commit-hash "${{ github.sha }}" \
            --bundle
